<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
  <!-- Getaway car (ahead) -->
  <rect x="12" y="8" width="10" height="6" rx="1" />
  <circle cx="14" cy="14" r="1" fill="currentColor" />
  <circle cx="20" cy="14" r="1" fill="currentColor" />
  
  <!-- Car window outline -->
  <rect x="15" y="8" width="4" height="3" rx="0.5" stroke="currentColor" fill="none" />
  
  <!-- Stick figure with head sticking out the window -->
  <circle cx="17" cy="7" r="1" />
  <line x1="17" y1="8" x2="17" y2="10" />
  <line x1="17" y1="9" x2="16" y2="10" />
  <line x1="17" y1="9" x2="18" y2="10" />
  
  <!-- Police car (behind) - solid outline, not dashed -->
  <rect x="2" y="11" width="8" height="5" rx="1" />
  <circle cx="4" cy="16" r="1" fill="currentColor" />
  <circle cx="8" cy="16" r="1" fill="currentColor" />
  
  <!-- POLICE text on the side of the car -->
  <text x="3.5" y="14" font-family="sans-serif" font-size="1.5" fill="currentColor" stroke="none">POLICE</text>
</svg>